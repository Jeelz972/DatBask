<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProStats Basket - Prototype Avancé</title>
    <style>
        :root { --primary: #0056b3; --accent: #ffc107; --bg: #f0f2f5; --court-bg: #d19a6a; --line: #fff; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* LAYOUT */
        aside { width: 300px; background: #fff; padding: 15px; display: flex; flex-direction: column; border-right: 1px solid #ccc; overflow-y: auto; }
        main { flex: 1; display: flex; flex-direction: column; position: relative; }
        
        /* HEADER & CHRONO */
        header { background: #222; color: #fff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .clock-display { font-size: 3rem; font-family: monospace; font-weight: bold; color: var(--accent); cursor: pointer; }
        .score-board { font-size: 2rem; font-weight: bold; }

        /* TERRAIN (COURT) */
        #court-container { flex: 1; position: relative; background: #333; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        canvas { background: var(--court-bg); border: 2px solid #fff; cursor: crosshair; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        /* PLAYERS LIST */
        .player-row { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #eee; cursor: pointer; align-items: center; }
        .player-row:hover { background: #f9f9f9; }
        .player-row.active { border-left: 4px solid var(--primary); background: #eef; }
        .on-bench { opacity: 0.6; background: #eee; }
        .foul-dot { height: 8px; width: 8px; background: red; border-radius: 50%; display: inline-block; margin-right: 2px; }
        
        /* ACTIONS & LOGS */
        .log-panel { height: 200px; background: #fff; border-top: 2px solid #444; overflow-y: scroll; padding: 10px; font-size: 0.9rem; }
        .log-item { display: flex; justify-content: space-between; padding: 5px; border-bottom: 1px solid #eee; }
        .btn-del { color: red; cursor: pointer; font-weight: bold; margin-left: 10px; }

        /* MODAL POPUP */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: #fff; padding: 20px; border-radius: 8px; width: 400px; text-align: center; }
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn { padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-blue { background: var(--primary); color: white; }
        .btn-sub { background: #6c757d; color: white; font-size: 0.8rem; padding: 2px 6px; }

        /* MARQUEUR SUR TERRAIN */
        .shot-marker { position: absolute; width: 10px; height: 10px; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        .made { background: green; border: 1px solid white; }
        .miss { background: red; opacity: 0.6; }
    </style>
</head>
<body>

    <aside id="roster-panel">
        <h3>Effectif (Temps de jeu)</h3>
        <div id="players-list">
            </div>
        <div style="margin-top: auto;">
            <button class="btn btn-blue" style="width:100%" onclick="exportToHTML()">Exporter Match (HTML)</button>
            <br><br>
            <button class="btn btn-sub" style="width:100%" onclick="saveGame()">Sauvegarder Match</button>
        </div>
    </aside>

    <main>
        <header>
            <div class="team-name">DOMICILE</div>
            <div class="score-board"><span id="scoreH">0</span> - <span id="scoreA">0</span></div>
            <div class="clock-display" id="clock" onclick="toggleClock()">10:00</div>
            <div class="team-name">VISITEUR</div>
        </header>

        <div id="court-container">
            <canvas id="courtCanvas" width="800" height="450"></canvas>
            </div>

        <div class="log-panel" id="playByPlay">
            <strong>Play-by-Play (Historique)</strong>
            <div id="log-entries"></div>
        </div>
    </main>

    <div id="actionModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Action</h3>
            <p id="shotInfo"></p>
            <div id="playerSelector" style="display:grid; grid-template-columns: repeat(3, 1fr); gap:5px; margin-bottom:15px;">
                </div>
            
            <div id="shotActions" class="modal-grid">
                <button class="btn btn-success" onclick="confirmShot(true)">MARQUÉ</button>
                <button class="btn btn-danger" onclick="confirmShot(false)">RATÉ</button>
            </div>
            <div id="otherActions" class="modal-grid" style="display:none">
                <button class="btn btn-blue" onclick="recordStat('assist')">Passe Dé</button>
                <button class="btn btn-blue" onclick="recordStat('reb_off')">Rebond OFF</button>
                <button class="btn btn-blue" onclick="recordStat('reb_def')">Rebond DEF</button>
                <button class="btn btn-danger" onclick="recordStat('turnover')">Balle Perdue</button>
                <button class="btn btn-danger" onclick="recordStat('foul')">Faute</button>
            </div>
            <br>
            <button class="btn" onclick="closeModal()">Annuler</button>
        </div>
    </div>

<script>
    // --- 1. CONFIGURATION & STATE ---
    const CONFIG = {
        courtWidth: 15, // mètres (largeur FIBA)
        courtHeight: 28, // mètres (longueur FIBA)
        hoopX: 7.5, // milieu largeur
        hoopY: 1.575, // distance panier ligne de fond
        threePointDist: 6.75 // distance 3pts
    };

    let GAME = {
        id: Date.now(),
        clock: 600, // secondes (10 min)
        isRunning: false,
        timer: null,
        score: { h: 0, a: 0 },
        actions: [],
        players: [
            { id: 4, name: "Dupont", num: "4", active: true, fouls: 0, time: 0, lastSubTime: 0 },
            { id: 5, name: "Martin", num: "5", active: true, fouls: 0, time: 0, lastSubTime: 0 },
            { id: 6, name: "Lefebvre", num: "6", active: true, fouls: 0, time: 0, lastSubTime: 0 },
            { id: 7, name: "Dubois", num: "7", active: true, fouls: 0, time: 0, lastSubTime: 0 },
            { id: 8, name: "Moreau", num: "8", active: true, fouls: 0, time: 0, lastSubTime: 0 },
            { id: 9, name: "Fournier", num: "9", active: false, fouls: 0, time: 0, lastSubTime: 0 },
            { id: 10, name: "Girard", num: "10", active: false, fouls: 0, time: 0, lastSubTime: 0 },
        ],
        tempShot: null // Stocke les coordonnées du clic en cours
    };

    // --- 2. INITIALISATION DU TERRAIN (CANVAS) ---
    const canvas = document.getElementById('courtCanvas');
    const ctx = canvas.getContext('2d');
    
    // Facteur d'échelle (Pixels par mètre)
    let scale = canvas.width / CONFIG.courtWidth; 

    function drawCourt() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Lignes simples
        ctx.strokeStyle = "white";
        ctx.lineWidth = 2;
        
        // Panier
        let hX = CONFIG.hoopX * scale;
        let hY = CONFIG.hoopY * scale; // Panier bas (demi-terrain)
        
        // Zone 3pts (Arc)
        ctx.beginPath();
        ctx.arc(hX, hY, CONFIG.threePointDist * scale, Math.PI, 0); // Demi cercle simplifié
        ctx.stroke();
        
        // Raquette (Simplifiée)
        ctx.strokeRect((CONFIG.hoopX - 2.45) * scale, 0, 4.9 * scale, 5.8 * scale);
        
        // Cercle panier
        ctx.beginPath();
        ctx.arc(hX, hY, 0.2 * scale, 0, Math.PI * 2);
        ctx.strokeStyle = "orange";
        ctx.stroke();

        // Repères tirs
        GAME.actions.forEach(a => {
            if (a.type === 'shot') {
                ctx.beginPath();
                ctx.arc(a.x, a.y, 5, 0, Math.PI*2);
                ctx.fillStyle = a.made ? '#00ff00' : '#ff0000';
                ctx.fill();
            }
        });
    }

    // --- 3. LOGIQUE CLIC TERRAIN (MATHS) ---
    canvas.addEventListener('mousedown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        // Conversion en mètres pour la logique
        const realX = x / scale;
        const realY = y / scale;

        // Calcul distance panier (Pythagore)
        const dist = Math.sqrt(Math.pow(realX - CONFIG.hoopX, 2) + Math.pow(realY - CONFIG.hoopY, 2));
        
        const value = dist > CONFIG.threePointDist ? 3 : 2;

        GAME.tempShot = { x, y, value };
        openModal('shot', value);
    });

    // --- 4. GESTION DU MATCH & TEMPS ---
    function toggleClock() {
        if (GAME.isRunning) {
            clearInterval(GAME.timer);
            GAME.isRunning = false;
            // Update play time for active players
            updatePlayingTime();
        } else {
            GAME.isRunning = true;
            // Set timestamp for play time tracking
            const now = Date.now();
            GAME.players.forEach(p => { if(p.active) p.lastSubTime = now; });
            
            GAME.timer = setInterval(() => {
                if (GAME.clock > 0) {
                    GAME.clock--;
                    updateClockUI();
                } else {
                    toggleClock();
                }
            }, 1000);
        }
    }

    function updatePlayingTime() {
        // En vrai production, c'est plus complexe, ici simplifié
        const now = Date.now();
        GAME.players.forEach(p => {
            if (p.active && GAME.isRunning) {
                p.time += (now - p.lastSubTime) / 1000;
                p.lastSubTime = now;
            }
        });
        renderRoster(); // Rafraichir l'UI
    }

    function updateClockUI() {
        let m = Math.floor(GAME.clock / 60).toString().padStart(2, '0');
        let s = (GAME.clock % 60).toString().padStart(2, '0');
        document.getElementById('clock').innerText = `${m}:${s}`;
    }

    // --- 5. LOGIQUE ACTIONS & STATS ---
    function openModal(type, value = 0) {
        document.getElementById('actionModal').style.display = 'flex';
        const pList = document.getElementById('playerSelector');
        pList.innerHTML = '';
        
        // Afficher seulement les 5 majeurs
        GAME.players.filter(p => p.active).forEach(p => {
            let btn = document.createElement('button');
            btn.className = 'btn btn-blue';
            btn.innerText = `#${p.num} ${p.name}`;
            btn.onclick = () => selectPlayerForAction(p.id);
            pList.appendChild(btn);
        });

        if (type === 'shot') {
            document.getElementById('modalTitle').innerText = "Tir détecté";
            document.getElementById('shotInfo').innerText = `Tentative à ${value} points`;
            document.getElementById('shotActions').style.display = 'grid';
            document.getElementById('otherActions').style.display = 'none';
        } else {
            document.getElementById('modalTitle').innerText = "Autre Statistique";
            document.getElementById('shotInfo').innerText = "Choisir le joueur concerné";
            document.getElementById('shotActions').style.display = 'none';
            document.getElementById('otherActions').style.display = 'grid';
        }
    }

    let selectedPlayerId = null;

    function selectPlayerForAction(id) {
        selectedPlayerId = id;
        // Met en évidence le bouton sélectionné
        const btns = document.getElementById('playerSelector').children;
        for(let b of btns) b.style.opacity = '0.5';
        event.target.style.opacity = '1';
    }

    function confirmShot(made) {
        if (!selectedPlayerId) return alert("Sélectionnez un joueur !");
        
        const action = {
            id: Date.now(),
            timeStr: document.getElementById('clock').innerText,
            type: 'shot',
            playerId: selectedPlayerId,
            val: GAME.tempShot.value,
            made: made,
            x: GAME.tempShot.x,
            y: GAME.tempShot.y
        };

        if (made) GAME.score.h += action.val;
        
        GAME.actions.unshift(action);
        closeModal();
        updateUI();
    }

    function recordStat(type) {
        // Pour les stats hors tirs (déclenchées par bouton manuel - à ajouter dans l'UI)
        // Ici simplifié dans le workflow shot pour l'exemple, ou via bouton "Autre"
        if (!selectedPlayerId) return alert("Sélectionnez un joueur !");
        
        const action = {
            id: Date.now(),
            timeStr: document.getElementById('clock').innerText,
            type: type,
            playerId: selectedPlayerId
        };

        // Gestion fautes
        if (type === 'foul') {
            let p = GAME.players.find(x => x.id === selectedPlayerId);
            p.fouls++;
            if (p.fouls >= 5) alert(`ATTENTION: ${p.name} a 5 fautes ! (Exclusion)`);
        }

        GAME.actions.unshift(action);
        closeModal();
        updateUI();
    }

    // --- 6. GESTION DES REMPLACEMENTS ---
    function toggleSub(playerId) {
        const player = GAME.players.find(p => p.id === playerId);
        const activeCount = GAME.players.filter(p => p.active).length;

        if (player.active) {
            // Sortie
            if (activeCount <= 1) return alert("Il faut au moins 1 joueur sur le terrain");
            player.active = false;
            // Ajouter event historique
            GAME.actions.unshift({id:Date.now(), timeStr: document.getElementById('clock').innerText, type: 'sub_out', playerId: player.id});
        } else {
            // Entrée
            if (activeCount >= 5) return alert("Déjà 5 joueurs ! Sortez-en un d'abord.");
            player.active = true;
            player.lastSubTime = Date.now();
            GAME.actions.unshift({id:Date.now(), timeStr: document.getElementById('clock').innerText, type: 'sub_in', playerId: player.id});
        }
        updateUI();
    }

    // --- 7. UI RENDERING & LOGS ---
    function deleteAction(id) {
        if(!confirm("Supprimer cette action ?")) return;
        const act = GAME.actions.find(a => a.id === id);
        
        // Revert Score
        if (act.type === 'shot' && act.made) GAME.score.h -= act.val;
        // Revert Faute
        if (act.type === 'foul') {
            GAME.players.find(p => p.id === act.playerId).fouls--;
        }

        GAME.actions = GAME.actions.filter(a => a.id !== id);
        updateUI();
    }

    function updateUI() {
        document.getElementById('scoreH').innerText = GAME.score.h;
        renderRoster();
        renderLog();
        drawCourt();
    }

    function renderRoster() {
        const div = document.getElementById('players-list');
        div.innerHTML = '';
        GAME.players.forEach(p => {
            let row = document.createElement('div');
            row.className = `player-row ${p.active ? 'active' : 'on-bench'}`;
            
            // Calcul minutes
            let mins = Math.floor(p.time / 60);
            let secs = Math.floor(p.time % 60);

            // Points rouges pour fautes
            let foulsDots = '';
            for(let i=0; i<p.fouls; i++) foulsDots += '<span class="foul-dot"></span>';

            row.innerHTML = `
                <div>
                    <strong>#${p.num} ${p.name}</strong><br>
                    <small>${mins}m ${secs}s</small>
                </div>
                <div style="text-align:right">
                    ${foulsDots}
                    <button class="btn-sub" onclick="toggleSub(${p.id})">${p.active ? 'OUT' : 'IN'}</button>
                </div>
            `;
            div.appendChild(row);
        });
    }

    function renderLog() {
        const div = document.getElementById('log-entries');
        div.innerHTML = '';
        GAME.actions.forEach(a => {
            const p = GAME.players.find(x => x.id === a.playerId);
            let desc = "";
            if (a.type === 'shot') desc = `Tir ${a.val}pts ${a.made ? 'MARQUÉ' : 'RATÉ'}`;
            else if (a.type === 'foul') desc = "FAUTE P.";
            else if (a.type === 'sub_in') desc = "ENTRÉE en jeu";
            else if (a.type === 'sub_out') desc = "SORTIE de jeu";
            else desc = a.type.toUpperCase();

            let el = document.createElement('div');
            el.className = 'log-item';
            el.innerHTML = `
                <span>${a.timeStr} - #${p.num} ${p.name}: ${desc}</span>
                <span class="btn-del" onclick="deleteAction(${a.id})">X</span>
            `;
            div.appendChild(el);
        });
    }

    function closeModal() {
        document.getElementById('actionModal').style.display = 'none';
        GAME.tempShot = null;
        selectedPlayerId = null;
    }

    // Ajout bouton manuel pour stats hors tirs
    const manualBtn = document.createElement('button');
    manualBtn.innerText = "+ Autres Stats (Reb/Passe/Faute)";
    manualBtn.className = "btn btn-blue";
    manualBtn.style.margin = "10px";
    manualBtn.onclick = () => openModal('other');
    document.querySelector('main').appendChild(manualBtn);


    // --- 8. EXPORT HTML & SAUVEGARDE ---
    function saveGame() {
        localStorage.setItem('myBasketGame', JSON.stringify(GAME));
        alert("Match sauvegardé dans le navigateur !");
    }

    function loadGame() {
        const saved = localStorage.getItem('myBasketGame');
        if (saved) {
            GAME = JSON.parse(saved);
            updateUI();
            alert("Match chargé !");
        }
    }

    function exportToHTML() {
        // Crée une table HTML simple
        let html = `<html><head><title>Rapport Match</title></head><body>`;
        html += `<h1>Rapport de Match - Score: ${GAME.score.h} - ${GAME.score.a}</h1>`;
        html += `<table border="1" cellpadding="5"><thead><tr><th>Temps</th><th>Joueur</th><th>Action</th></tr></thead><tbody>`;
        
        GAME.actions.forEach(a => {
            const p = GAME.players.find(x => x.id === a.playerId);
            let desc = a.type === 'shot' ? `Tir ${a.val}pts ${a.made ? 'OK' : 'KO'}` : a.type;
            html += `<tr><td>${a.timeStr}</td><td>#${p.num} ${p.name}</td><td>${desc}</td></tr>`;
        });
        
        html += `</tbody></table></body></html>`;

        const blob = new Blob([html], {type: 'text/html'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `match_export_${Date.now()}.html`;
        a.click();
    }

    // Init
    drawCourt();
    renderRoster();
    // Tentative de chargement auto
    if(localStorage.getItem('myBasketGame')) {
        if(confirm("Match précédent trouvé. Le charger ?")) loadGame();
    }

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Basket Stats V4 - Gestion Fautes Avancée</title>
    <style>
        :root { --primary: #007bff; --danger: #dc3545; --dark: #222; --light: #f8f9fa; --court: #d19a6a; --success: #28a745; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--dark); color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* --- UI GENERALE (Similaire V3) --- */
        #match-screen { display: flex; flex-direction: column; height: 100%; }
        
        /* Scoreboard */
        .scoreboard { background: #111; padding: 5px 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; height: 50px; }
        .score-display { font-size: 1.5rem; font-weight: bold; }
        .timer-box { font-family: monospace; font-size: 1.8rem; color: #ffc107; cursor: pointer; border: 1px solid #555; padding: 0 10px; border-radius: 4px; }
        
        /* Rosters */
        .roster-strip { background: #333; padding: 5px; overflow-x: auto; white-space: nowrap; height: 60px; display: flex; align-items: center; }
        .roster-strip::-webkit-scrollbar { display: none; }
        .p-chip { display: inline-block; background: #555; color: white; padding: 5px 10px; border-radius: 20px; margin-right: 8px; min-width: 50px; text-align: center; cursor: pointer; border: 2px solid transparent; }
        .p-chip.selected { background: #fff; color: black; border-color: var(--primary); font-weight: bold; transform: scale(1.05); }
        .p-chip small { display: block; font-size: 0.65rem; opacity: 0.8; }

        /* Terrain */
        .court-container { flex: 1; position: relative; background: #222; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        canvas { background: var(--court); border: 2px solid white; }
        .overlay-msg { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; font-size: 0.9rem; pointer-events: none; opacity: 0; transition: 0.3s; z-index: 10; }
        .overlay-msg.visible { opacity: 1; }

        /* Actions Grid */
        .controls-area { background: #fff; padding: 5px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; height: 140px; }
        .btn-act { border: none; border-radius: 4px; font-weight: bold; font-size: 0.8rem; color: white; cursor: pointer; padding: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .btn-act:active { filter: brightness(0.8); }
        .bg-reb { background: #6c5ce7; } .bg-ast { background: #00b894; } .bg-flt { background: #d63031; } .bg-blk { background: #2d3436; } .bg-oth { background: #fdcb6e; color: #333; }

        /* --- MODAL WIZARD (NOUVEAU) --- */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; }
        .modal-box { background: white; color: #333; width: 90%; max-width: 400px; border-radius: 10px; padding: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .modal-title { font-size: 1.4rem; font-weight: bold; margin-bottom: 20px; color: var(--primary); }
        .modal-btns { display: grid; gap: 10px; }
        .modal-btns.cols-2 { grid-template-columns: 1fr 1fr; }
        .btn-wizard { padding: 15px; font-size: 1.1rem; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; }
        .btn-yes { background: var(--success); }
        .btn-no { background: var(--danger); }
        .btn-opt { background: var(--primary); }
        
    </style>
</head>
<body>

    <div id="match-screen">
        <div class="scoreboard">
            <div style="color:var(--primary)">HOME</div>
            <div class="score-display">
                <span id="scoreH" style="color:var(--primary)">0</span> - <span id="scoreA" style="color:var(--danger)">0</span>
            </div>
            <div style="color:var(--danger)">AWAY</div>
            <div class="timer-box" id="clock" onclick="toggleClock()">10:00</div>
        </div>

        <div class="roster-strip" id="stripHome"></div>

        <div class="court-container">
            <div id="msgOverlay" class="overlay-msg">Instructions ici</div>
            <canvas id="courtCanvas"></canvas>
        </div>

        <div class="roster-strip" id="stripAway"></div>

        <div class="controls-area">
            <button class="btn-act bg-reb" onclick="doSimpleStat('REB_OFF')">REB<br>OFF</button>
            <button class="btn-act bg-reb" onclick="doSimpleStat('REB_DEF')">REB<br>DEF</button>
            <button class="btn-act bg-ast" onclick="doSimpleStat('AST')">PASSE<br>DÉ</button>
            <button class="btn-act bg-oth" onclick="doSimpleStat('STL')">INTER<br>CEPT</button>
            
            <button class="btn-act bg-flt" onclick="startFoulProcess()">FAUTE<br>(Wizard)</button>
            
            <button class="btn-act bg-ast" onclick="doSimpleStat('FOUL_DRAWN')">FTE<br>PROV.</button>
            <button class="btn-act bg-blk" onclick="doSimpleStat('BLK')">CONTRE<br>(Block)</button>
            <button class="btn-act bg-blk" style="background:#555" onclick="initBlockReceived()">CONTRE<br>SUBI</button>

            <button class="btn-act" style="background:#444; grid-column: span 2;" onclick="undoLast()">ANNULER</button>
            <button class="btn-act" style="background:#0984e3; grid-column: span 2;" onclick="exportCSV()">EXPORTER</button>
        </div>
    </div>

    <div id="wizardModal" class="modal-overlay">
        <div class="modal-box">
            <div id="wizTitle" class="modal-title">Titre</div>
            <div id="wizContent" class="modal-btns">
                </div>
        </div>
    </div>

<script>
    // --- 1. CONFIGURATION & STATE ---
    const STATE = {
        players: [], 
        actions: [],
        selectedPlayerId: null,
        clock: 600, isRunning: false, timerInt: null,
        pendingAction: null, // 'BLOCK_RECEIVED', 'FOUL_LOC'
        foulContext: {} // Stocke les données durant le wizard de faute
    };

    const CANVAS_WIDTH = 360; 
    const CANVAS_HEIGHT = 250;

    // Données fictives pour démo immédiate
    function initDemo() {
        const createP = (id, num, name, team) => ({id, num, name, team, stats: {pts:0, reb:0, fouls:0, ftm:0, fta:0}});
        STATE.players.push(createP(1, "4", "Westbrook", "h"));
        STATE.players.push(createP(2, "6", "LeBron", "h"));
        STATE.players.push(createP(3, "3", "Davis", "h"));
        STATE.players.push(createP(11, "0", "Tatum", "a"));
        STATE.players.push(createP(12, "7", "Brown", "a"));
        STATE.players.push(createP(13, "36", "Smart", "a"));
        renderRosters();
        drawCourt();
    }

    // --- 2. GESTION DU WIZARD FAUTE (Le cœur de ta demande) ---

    // ÉTAPE 1 : Démarrage
    function startFoulProcess() {
        if (!STATE.selectedPlayerId) return alert("Sélectionne un joueur fautif !");
        
        // Reset context
        STATE.foulContext = {
            playerId: STATE.selectedPlayerId,
            isShooting: false,
            shotVal: 0,
            shotMade: false,
            ftCount: 0
        };

        showModal("Faute sur Tir ?", [
            { txt: "OUI", cls: "btn-yes", cb: () => handleFoulStep1(true) },
            { txt: "NON", cls: "btn-no", cb: () => handleFoulStep1(false) }
        ], true);
    }

    // ÉTAPE 2 : Branchement
    function handleFoulStep1(isOnShot) {
        STATE.foulContext.isShooting = isOnShot;
        closeModal();

        if (isOnShot) {
            // Etape 2A : Demander la zone sur le terrain
            STATE.pendingAction = 'FOUL_LOC';
            showOverlay("CLIQUEZ SUR LA ZONE DU TIR");
        } else {
            // Etape 2B : Pas sur tir -> Direct aux LFs (Bonus ?)
            // On demande s'il y a des LFs (Bonus ou faute technique)
            askFreeThrowCount(true); // true = mode manuel (0 ou 2)
        }
    }

    // ÉTAPE 2A (Suite) : Après clic terrain (appelé par handleCourtClick)
    function handleFoulShotLoc(x, y, val) {
        STATE.foulContext.shotVal = val;
        hideOverlay();
        
        // Demande si panier marqué
        showModal(`Tir à ${val} pts marqué ?`, [
            { txt: "OUI (Panier Accordé)", cls: "btn-yes", cb: () => handleFoulShotResult(true) },
            { txt: "NON (Tir Raté)", cls: "btn-no", cb: () => handleFoulShotResult(false) }
        ], true);
    }

    // ÉTAPE 3 : Calcul des LFs et demande de réussite
    function handleFoulShotResult(made) {
        STATE.foulContext.shotMade = made;

        if (made) {
            // Panier marqué -> On compte le tir
            recordShot(STATE.foulContext.playerId, STATE.foulContext.shotVal, true);
            // And-1 : Généralement 1 seul LF
            STATE.foulContext.ftCount = 1; 
        } else {
            // Panier raté -> On NE compte PAS le tir (règle FIBA)
            // LFs = Valeur du tir (2 ou 3)
            STATE.foulContext.ftCount = STATE.foulContext.shotVal;
        }
        
        closeModal();
        askFreeThrowResult(STATE.foulContext.ftCount);
    }

    function askFreeThrowCount(isNonShooting) {
        // Cas faute non sur tir : Bonus (2) ou rien (0) ?
        showModal("Lancers Francs à tirer ?", [
            { txt: "0 LF (Touche)", cls: "btn-no", cb: () => finalizeFoul(0) },
            { txt: "2 LF (Bonus)", cls: "btn-opt", cb: () => askFreeThrowResult(2) } // Si 2 LF, on demande combien mis
        ]);
    }

    // Interface finale : "Combien de lancers marqués ?"
    function askFreeThrowResult(count) {
        let buttons = [];
        
        // Génère les boutons 0, 1, 2... selon le nombre de LF
        for(let i=0; i<=count; i++) {
            buttons.push({ 
                txt: `${i} Marqué${i>1?'s':''}`, 
                cls: "btn-opt", 
                cb: () => finalizeFoul(i, count) 
            });
        }

        showModal(`${count} Lancer${count>1?'s':''} Franc${count>1?'s':''} : Résultat ?`, buttons);
    }

    // FIN DU PROCESSUS
    function finalizeFoul(madeCount, attemptCount = 0) {
        closeModal();
        const pId = STATE.foulContext.playerId;

        // 1. Enregistrer la faute
        recordAction(pId, 'FOUL', { detail: STATE.foulContext.isShooting ? "Sur Tir" : "Classique" });
        const p = getPlayer(pId);
        p.stats.fouls++;

        // 2. Enregistrer les LFs
        if (attemptCount > 0) {
            // On enregistre globalement X/Y LF
            p.stats.ftm += madeCount;
            p.stats.fta += attemptCount;
            // Mise à jour score
            p.stats.pts += madeCount;
            
            // Log spécifique
            recordAction(pId, 'FREE_THROW', { 
                detail: `${madeCount}/${attemptCount}`, 
                pts: madeCount 
            });
        }

        updateUI();
        STATE.selectedPlayerId = null; // Reset selection
        renderRosters();
    }

    // --- 3. UTILITAIRES UI (MODAL) ---
    function showModal(title, buttons, cols2 = false) {
        document.getElementById('wizTitle').innerText = title;
        const container = document.getElementById('wizContent');
        container.innerHTML = '';
        container.className = cols2 ? 'modal-btns cols-2' : 'modal-btns';

        buttons.forEach(b => {
            let btn = document.createElement('button');
            btn.className = `btn-wizard ${b.cls}`;
            btn.innerText = b.txt;
            btn.onclick = b.cb;
            container.appendChild(btn);
        });

        document.getElementById('wizardModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('wizardModal').style.display = 'none';
    }

    // --- 4. LOGIQUE STANDARD ---
    const canvas = document.getElementById('courtCanvas');
    canvas.width = CANVAS_WIDTH; canvas.height = CANVAS_HEIGHT;
    const ctx = canvas.getContext('2d');

    function drawCourt() {
        ctx.fillStyle = "#d19a6a"; ctx.fillRect(0,0, CANVAS_WIDTH, CANVAS_HEIGHT);
        ctx.strokeStyle = "white"; ctx.lineWidth = 2;
        // Dessin simplifié
        ctx.strokeRect(0, 85, 100, 80); 
        ctx.beginPath(); ctx.arc(0, 125, 130, -1.2, 1.2); ctx.stroke();
        ctx.strokeRect(CANVAS_WIDTH-100, 85, 100, 80);
        ctx.beginPath(); ctx.arc(CANVAS_WIDTH, 125, 130, Math.PI - 1.2, Math.PI + 1.2); ctx.stroke();
        
        // Afficher tirs
        STATE.actions.forEach(a => {
            if(a.type === 'shot') {
                ctx.beginPath(); ctx.arc(a.x, a.y, 4, 0, Math.PI*2);
                ctx.fillStyle = a.made ? '#28a745' : '#dc3545';
                if(a.subType === 'blocked') ctx.strokeStyle = "black";
                ctx.fill(); ctx.stroke();
            }
        });
    }

    canvas.addEventListener('mousedown', handleCourtClick);
    
    function handleCourtClick(e) {
        // Si on est dans le processus de faute (Etape 2A)
        if (STATE.pendingAction === 'FOUL_LOC') {
            const coords = getCoords(e);
            let val = (coords.x > 130 && coords.x < CANVAS_WIDTH - 130) ? 3 : 2;
            STATE.pendingAction = null;
            handleFoulShotLoc(coords.x, coords.y, val);
            return;
        }

        // Si Contre Subi
        if (STATE.pendingAction === 'BLOCK_RECEIVED') {
            const coords = getCoords(e);
            let val = (coords.x > 130 && coords.x < CANVAS_WIDTH - 130) ? 3 : 2;
            STATE.pendingAction = null; hideOverlay();
            
            if(!STATE.selectedPlayerId) return;
            // Enregistre tir raté (contré)
            recordShot(STATE.selectedPlayerId, val, false, coords.x, coords.y, 'blocked');
            alert("Contre subi enregistré");
            return;
        }

        // Tir standard
        if (STATE.selectedPlayerId) {
            const coords = getCoords(e);
            let val = (coords.x > 130 && coords.x < CANVAS_WIDTH - 130) ? 3 : 2;
            if(confirm(`Tir ${val}pts ? OK=Marqué`)) {
                recordShot(STATE.selectedPlayerId, val, true, coords.x, coords.y);
            } else {
                recordShot(STATE.selectedPlayerId, val, false, coords.x, coords.y);
            }
        }
    }

    function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    // --- 5. DATA ENGINE ---
    function doSimpleStat(type) {
        if (!STATE.selectedPlayerId) return alert("Sélectionne un joueur !");
        recordAction(STATE.selectedPlayerId, type);
        // Incrément simple
        const p = getPlayer(STATE.selectedPlayerId);
        if(type==='REB_OFF' || type==='REB_DEF') p.stats.reb++;
        if(type==='AST') p.stats.ast++;
        updateUI();
    }

    function recordShot(pId, val, made, x=0, y=0, subType=null) {
        const p = getPlayer(pId);
        if(made) p.stats.pts += val;
        
        recordAction(pId, 'shot', { val, made, x, y, subType });
        updateUI();
        drawCourt();
    }

    function recordAction(pId, type, data={}) {
        const p = getPlayer(pId);
        STATE.actions.push({
            id: Date.now(),
            playerId: pId,
            type: type,
            ...data,
            time: document.getElementById('clock').innerText
        });
    }

    function getPlayer(id) {
        return STATE.players.find(p => p.id === id);
    }

    function updateUI() {
        const sumPts = (t) => STATE.players.filter(p => p.team === t).reduce((a,b) => a + b.stats.pts, 0);
        document.getElementById('scoreH').innerText = sumPts('h');
        document.getElementById('scoreA').innerText = sumPts('a');
        renderRosters();
    }

    function renderRosters() {
        const fill = (divId, tm) => {
            const div = document.getElementById(divId);
            div.innerHTML = '';
            STATE.players.filter(p => p.team === tm).forEach(p => {
                let el = document.createElement('div');
                el.className = `p-chip ${STATE.selectedPlayerId === p.id ? 'selected' : ''}`;
                // Affichage Score + Fautes
                el.innerHTML = `${p.num}<small>${p.stats.pts}p ${p.stats.fouls}f</small>`;
                el.onclick = () => { STATE.selectedPlayerId = p.id; renderRosters(); };
                div.appendChild(el);
            });
        };
        fill('stripHome', 'h'); fill('stripAway', 'a');
    }

    function initBlockReceived() {
        if (!STATE.selectedPlayerId) return alert("Qui subit ?");
        STATE.pendingAction = 'BLOCK_RECEIVED';
        showOverlay("Où était le tir ?");
    }
    function showOverlay(t) { document.getElementById('msgOverlay').innerText = t; document.getElementById('msgOverlay').classList.add('visible'); }
    function hideOverlay() { document.getElementById('msgOverlay').classList.remove('visible'); }

    // Démarrage
    initDemo();

</script>
</body>
</html>
